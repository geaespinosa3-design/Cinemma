<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinemma | Galería</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body id="inicio">

  <header>
    <h1>Galería Cinemma</h1>
    <p>Haz clic en la cartelera de tu interés.</p>
    <nav>
      <a href="#estrenos">Estrenos</a>
      <a href="#clasicos">Clásicos</a>
      <a href="#eventos">Eventos</a>
    </nav>
  </header>

  <main>

    <!-- Sección: Estrenos -->
    <section id="estrenos">
      <h2>Estrenos</h2>
      <p>Noche de estreno</p>
      <div class="galeria">
        <figure>
          <a href="residen.png"><img src="residen.png" alt="Resident Evil: Noche Cero"></a>
          <figcaption>Resident Evil: Noche Cero</figcaption>
        </figure>
        <figure>
          <a href="gato.jpg"><img src="gato.jpg" alt="Gato con sombrero"></a>
          <figcaption>Gato con sombrero</figcaption>
        </figure>
        <div class="galeria">
        <figure>
          <a href="imagen4.jpg.jpg"><img src="imagen4.jpg.jpg" alt="tim burton"></a>
          <figcaption>tim burton</figcaption>
        </figure>
      </div>
    </section>

    <!-- Sección: Clásicos -->
    <section id="clasicos">
      <h2>Clásicos</h2>
      <div class="galeria">
        <figure>
          <a href="images.jpg"><img src="images.jpg" alt="Clásicos en pantalla"></a>
          <figcaption>Clásicos en pantalla</figcaption>
        </figure>
        <figure>
          <a href="imagen5.jpg.jpg"><img src="imagen5.jpg.jpg" alt="Mediooriente"></a>
          <figcaption>Medio oriente</figcaption>
        </figure>
        <figure>
          <a href="imagen13.jpg.jpg"><img src="imagen13.jpg.jpg" alt="Jonh Wick"></a>
          <figcaption>Jonh Wick</figcaption>
        </figure>
      </div>
    </section>

    <!-- Sección: Eventos -->
    <section id="eventos">
      <h2>Eventos</h2>
      <div class="galeria">
        <figure>
          <a href="images%20(1).jpg"><img src="images%20(1).jpg" alt="Cine al aire libre"></a>
          <figcaption>Cine al aire libre</figcaption>
        </figure>
         <figure>
          <a href="imagen8.jpg.jpg"><img src="imagen8.jpg.jpg" alt="Spiderman"></a>
          <figcaption>Spiderman</figcaption>
        </figure>
         <figure>
          <a href="imagen14.jpg.jpg"><img src="imagen14.jpg.jpg" alt="Obsession"></a>
          <figcaption>Obsession</figcaption>
        </figure>
      </div>
    </section>

    <p class="volver"><a href="#inicio">Volver arriba</a></p>
  </main>

  <footer>
    <p>Todos los derechos reservados</p>
    <p>© 2026</p>
  </footer>

</body>
</html>
