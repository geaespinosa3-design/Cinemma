<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinnema | Formulario de Contacto</title>
</head>

<body background="fondo_morado_negro.png" bgcolor="#1E1045" text="#FFE97A">

<center>

    <br>
    <font face="Impact, Arial Black, sans-serif" size="7" color="#F5ECD9">
        <h1>CINEMMA</h1>
    </font>

    <form>
        <table border="4" bordercolor="#E3B04B" cellpadding="20" cellspacing="0" bgcolor="#14101A" width="450">
            <tr>
                <td>
                    <font face="Verdana, Arial, sans-serif" size="3" color="#F5ECD9">

                        <center>
                            <font face="Impact, Arial Black, sans-serif" size="6" color="#E3B04B">
                                <h2>¡Te contactamos!</h2>
                            </font>
                        </center>

                        <b>Nombre:</b><br>
                        <input type="text" name="nombre" size="40" required><br><br>

                        <b>Apellido:</b><br>
                        <input type="text" name="apellido" size="40" required><br><br>

                        <b>Email:</b><br>
                        <input type="email" name="email" size="40" required><br><br>

                        
                        <b>Anexe Foto Ticket</b><br>
                        <input type="file" name="archivo"><br><br>

                        <fieldset>
                            <legend><b>SELECCIONE PAIS DE UBICACION</b></legend>
                            <input type="checkbox" name="pais1" value="Mexico"> México<br>
                            <input type="checkbox" name="pais2" value="Colombia"> Colombia<br>
                            <input type="checkbox" name="pais3" value="Argentina"> Ecuador<br>
                        </fieldset>
                        <br>

                        <center>
                            <input type="submit" value="Enviar">
                        </center>

                    </font>
                </td>
            </tr>
        </table>
    </form>

    <br>


                  <!-- PIE DE PAGINA -->
    <footer>
        <p>Todos los derechos reservados</p>
        <p>© 2026</p>
        
    </footer>


</center>

</body>
</html>
